<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1012" />
    <title>Black Halo</title>
    <link rel="preload" href="/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/shell.css" />
  </head>
  <body>
    <div class="app">
      <!-- Handy: Kopfzeile -->
      <header class="topbar">
        <span class="mark-slot"></span>
        <span class="brand-name">Black Halo</span>
        <span class="grow"></span>
        <span class="pill" id="conn-pill" role="status"><span class="led"></span><span class="pill-text">Verbinde</span></span>
      </header>

      <!-- PC/Tablet: Seitenleiste, Handy: Tab-Leiste unten -->
      <aside class="rail">
        <a class="brand" href="#" aria-label="Black Halo – Start">
          <span class="mark-slot"></span>
          <span class="brand-text"><span class="brand-name">Black Halo</span><span class="brand-sub">Enterprises</span></span>
        </a>
        <div class="hazard-strip" aria-hidden="true"></div>
        <nav class="nav" id="nav" aria-label="Hauptnavigation">
          <div class="nav-caption">Module</div>
        </nav>
        <div class="conn" id="conn">
          <span class="led" aria-hidden="true"></span>
          <span class="conn-text" aria-live="polite"><span class="conn-state">Verbinde</span><span class="conn-meta" id="conn-meta"></span></span>
        </div>
        <div class="rail-foot" id="rail-foot">BHE-COMPANION</div>
      </aside>

      <main id="main">
        <div class="banner" role="status">
          <svg class="ic" aria-hidden="true"><use href="#i-unplug" /></svg>
          <p><strong>Keine Verbindung zum PC.</strong> Neuer Versuch läuft automatisch. Eingaben bleiben erhalten.</p>
        </div>
        <div id="view"><p class="view-loading">Lade ...</p></div>
      </main>
    </div>

    <!-- Markenzeichen, wird in die .mark-slot-Plätze kopiert -->
    <template id="brand-mark-tpl">
      <svg class="brand-mark" viewBox="0 0 48 48" role="img" aria-label="Black Halo">
        <circle cx="24" cy="24" r="23" fill="#1b1f23" stroke="#454c53" stroke-width="1" />
        <path d="M24 2.5v4M24 41.5v4M2.5 24h4M41.5 24h4" stroke="#868c92" stroke-width="2" />
        <circle cx="24" cy="24" r="15.5" fill="none" stroke="#ff8f1f" stroke-width="4" stroke-dasharray="83 14.4" transform="rotate(-18 24 24)" />
        <circle cx="24" cy="24" r="15.5" fill="none" stroke="#ffd28c" stroke-width="1.5" stroke-dasharray="6 91.4" transform="rotate(-62 24 24)" />
        <circle cx="24" cy="24" r="10.5" fill="#0a0b0d" />
      </svg>
    </template>

    <script type="module" src="/shell.js"></script>
  </body>
</html>
